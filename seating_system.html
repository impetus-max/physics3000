<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>물리 실험실 좌석 배치</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    /* 🎨 Scientific Modern UI (Font Size Upgraded) */
    :root { 
      --primary: #4F46E5; --primary-light: #818cf8;
      --secondary: #64748b; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
      --bg-body: #f8fafc; --text-main: #1e293b; --text-sub: #64748b; --border: #e2e8f0;
      --font: 'Pretendard', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg-body); margin: 0; padding: 20px; color: var(--text-main); }
    .container { max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
    .hidden { display: none !important; }

    /* 로그인 화면 */
    .login-wrapper { position: fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:linear-gradient(135deg, #1e1b4b, #312e81); z-index:1000; }
    .login-card { background:white; width:100%; max-width:420px; padding:40px; border-radius:24px; box-shadow:0 25px 50px rgba(0,0,0,0.5); text-align:center; }
    .login-icon { font-size: 50px; margin-bottom: 15px; display: block; text-shadow: 0 0 15px rgba(99,102,241,0.5); }
    .login-title { font-size: 28px; font-weight: 800; color: #1e293b; margin: 0; }
    .styled-input { width:100%; padding:14px; border:1px solid var(--border); border-radius:12px; font-size:18px; margin-bottom:12px; background:#f8fafc; }
    .btn-login { width:100%; padding:16px; margin-top:10px; background:var(--primary); color:white; border:none; border-radius:12px; font-size:18px; font-weight:700; cursor:pointer; }
    .btn-login:disabled { background: #ccc; cursor: not-allowed; }

    /* 메인 UI */
    .dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .header-title { font-size: 26px; font-weight:800; color:var(--primary); }
    .card { background:white; border-radius:20px; padding:24px; box-shadow:0 4px 6px rgba(0,0,0,0.05); margin-bottom:24px; border:1px solid var(--border); }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:15px; }
    
    /* 좌석 */
    .seat-container { overflow-x:auto; text-align:center; padding:20px 0; }
    .screen-board { display:inline-block; background:#1e293b; color:white; padding:14px 110px; border-radius:12px; font-weight:800; font-size:20px; margin-bottom:30px; letter-spacing:4px; }
    .seat-row { display:flex; justify-content:center; gap:30px; margin-bottom:30px; min-width:800px; }
    .table-group { background:white; border:2px solid #cbd5e0; border-radius:16px; padding:12px; position:relative; }
    .table-label { position:absolute; top:-26px; left:0; width:100%; text-align:center; font-size:15px; font-weight:700; color:#64748b; }
    .seat-grid-2x2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    
    /* 학생 화면 좌석 버튼 글씨 크기업 */
    .seat-btn { width:95px; height:80px; border-radius:12px; border:2px solid #e2e8f0; background:white; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; transition:0.2s; }
    .seat-btn b { font-size:20px; color:#1e293b; font-weight:800; }
    .seat-btn span { font-size:14px; color:#94a3b8; }
    .seat-btn.my-seat { background:var(--primary); border-color:var(--primary); box-shadow:0 0 0 4px rgba(79,70,229,0.3); }
    .seat-btn.my-seat b, .seat-btn.my-seat span { color:white; }
    .seat-btn.occupied { background:#f8fafc; cursor:not-allowed; opacity:0.8; }

    /* 👨‍🏫 교사 화면 좌석 버튼 글씨 초특대화 */
    .teacher-mode .seat-btn { width: 130px; height: 100px; } 
    .teacher-mode .seat-btn b { font-size: 26px; }
    .teacher-mode .seat-btn span { font-size: 16px; }
    .teacher-mode .seat-btn.occupied { background: #e0e7ff; border-color: var(--primary-light); opacity: 1; color: var(--primary); }
    .teacher-mode .seat-btn.occupied b { color: var(--primary); }
    .teacher-mode .seat-btn.absent-seat { background: #fee2e2; border-color: #fca5a5; }
    .teacher-mode .seat-btn.absent-seat b { color: #dc2626; }
    .teacher-mode .seat-btn.absent-seat span { color: #b91c1c; font-weight:700; font-size: 14px; }

    /* 📋 명단 테이블 글씨 대폭 확대 */
    .excel-table { width:100%; border-collapse:collapse; font-size:18px; text-align:center; white-space:nowrap; }
    .excel-table th { background:#f8fafc; padding:14px; font-weight:800; border-bottom:1px solid #e2e8f0; color:#475569; }
    .excel-table td { padding:14px; border-bottom:1px solid #e2e8f0; vertical-align: middle; }
    .badge { padding:6px 10px; border-radius:8px; font-size:15px; font-weight:800; }
    .bg-green { background:#dcfce7; color:#166534; } .bg-red { background:#fee2e2; color:#991b1b; }

    /* 비고 입력창 스타일 */
    .note-input { width: 120px; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; font-family: inherit; transition: 0.2s; }
    .note-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }

    /* 모달 */
    .modal-backdrop { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:2000; opacity:0; pointer-events:none; transition:0.2s; backdrop-filter:blur(4px); }
    .modal-backdrop.active { opacity:1; pointer-events:auto; }
    .modal-content { background:white; padding:30px; border-radius:24px; text-align:center; width:380px; transform:scale(0.9); transition:0.2s; }
    .modal-backdrop.active .modal-content { transform:scale(1); }
    .rps-btn { font-size:50px; margin:0 10px; cursor:pointer; padding:15px; border-radius:50%; background:#f1f5f9; transition:0.2s; }
    .rps-btn:hover { background:#e0e7ff; transform:scale(1.1); }
    .rps-btn.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; filter: grayscale(100%); }
    
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(50px); background:#1e293b; color:white; padding:12px 24px; border-radius:50px; font-weight:700; opacity:0; transition:0.3s; z-index:3000; font-size:16px; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    
    /* 버튼 텍스트업 */
    .btn-act { padding:12px 18px; border-radius:8px; font-weight:800; border:none; cursor:pointer; color:white; font-size: 16px; }
    .dark-input { background:#334155; border:none; color:white; padding:12px; border-radius:8px; font-size: 16px; }
    .btn-auto { background: var(--primary); width: 100%; margin-top: 10px; padding: 14px; border-radius: 12px; color: white; font-weight: 800; cursor: pointer; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-auto:hover { background: var(--primary-light); }
    .alert-box { background:#fff1f2; border:1px solid #fecaca; color:#be123c; padding:14px; border-radius:12px; text-align:center; font-weight:800; margin-bottom:20px; font-size:18px; }

    /* 푸터 */
    footer { text-align: center; margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--text-sub); font-size: 15px; }
  </style>
</head>
<body>

  <div id="view-login" class="login-wrapper">
    <div class="login-card">
      <div class="login-icon">🧲 ⚡</div>
      <h1 class="login-title" style="font-size:15px;">2026학년도 2학기 좌석 배정</h1>
      
      <div style="text-align:left;">
        <label style="font-size:15px; font-weight:700; color:#475569; display:block; margin-bottom:6px;">분반</label>
        <select id="login-class" class="styled-input">
          <option value="전자기와 양자 A">전자기와 양자 A</option>
          <option value="전자기와 양자 C">전자기와 양자 C</option>
          <option value="전자기와 양자 D">전자기와 양자 D</option>
          <option value="전자기와 양자 E">전자기와 양자 E</option>
        </select>
        <label style="font-size:15px; font-weight:700; color:#475569; display:block; margin-bottom:6px;">학번</label>
        <input type="text" id="login-id" class="styled-input" placeholder="예: 21001">
        <label style="font-size:15px; font-weight:700; color:#475569; display:block; margin-bottom:6px;">이름</label>
        <input type="text" id="login-name" class="styled-input" placeholder="예: 홍길동">
      </div>
      <button class="btn-login" id="btn-login-action" onclick="handleLogin()">입장하기</button>
    </div>
  </div>

  <div id="view-main" class="container hidden">
    <div class="dashboard-header" style="margin-top:20px;">
      <h2 class="header-title">⚛️ 물리 실험실</h2>
      <div style="font-size:16px; font-weight:700; color:#64748b;" id="user-display"></div>
    </div>
    
    <div id="teacher-panel" class="card hidden" style="background:#1e293b; color:white;">
      <div class="card-header" style="border-color:rgba(255,255,255,0.1);">
        <span style="font-size:20px; font-weight:800;">👨‍🏫 교사 제어판</span>
        <button onclick="location.reload()" class="btn-act" style="background:rgba(255,255,255,0.1);">나가기</button>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input type="datetime-local" id="sched-time" class="dark-input">
        <button onclick="setSchedule()" class="btn-act" style="background:#10b981;">예약 저장</button>
        <div style="flex:1;"></div>
        <button onclick="assignAbsent()" class="btn-act" style="background:#dc2626;">🚫 미접속자 일괄 배정</button>
        <button id="btn-start" onclick="toggleStart(true)" class="btn-act" style="background:#4F46E5;">🚀 좌석 배치 시작</button>
        <button id="btn-stop" onclick="toggleStart(false)" class="btn-act hidden" style="background:#ef4444;">⛔ 배치 마감</button>
        <button onclick="resetSeats()" class="btn-act" style="background:#f59e0b; color:black;">🔄 초기화</button>
        <button onclick="exportImage()" class="btn-act" style="background:#475569;">📷 좌석 배치도 저장</button>
      </div>
      <div id="sched-msg" style="margin-top:10px; color:#4ade80; font-size:15px; font-weight:800;"></div>
    </div>

    <div class="card" id="seat-area-capture">
      <div class="card-header">
        <span style="font-size:20px; font-weight:800; color:#1e293b;" id="map-class-title"></span>
        <span style="font-size:16px; color:#64748b; font-weight:700;" id="current-date"></span>
      </div>
      
      <div id="student-alert" class="hidden alert-box">
        ⚠️ 한 번 좌석이 확정되면 수정할 수 없습니다. 신중하게 선택하세요!
      </div>

      <div id="student-controls" class="hidden" style="margin-bottom: 20px;">
        <button class="btn-auto" onclick="autoAssign()">🎲 랜덤 자동 배치 (빈자리)</button>
      </div>

      <div class="seat-container">
        <div class="screen-board">전자 칠판</div>
        <div id="seat-grid"></div>
      </div>
    </div>

    <div class="card hidden" id="roster-card">
      <div class="card-header">
        <span style="font-size:20px; font-weight:800;">📋 출결 현황</span>
        <div style="display:flex; gap:10px; align-items:center;">
          <span id="roster-count" style="font-size:16px; font-weight:700; color:#64748b;">0/0</span>
          <button onclick="downloadExcel()" class="btn-act" style="background:#10b981; font-size:14px;">📥 엑셀 다운로드</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="excel-table" id="export-table">
          <thead>
            <tr>
              <th width="8%">연번</th>
              <th width="15%">학번</th>
              <th width="15%">이름</th>
              <th width="10%">출결</th>
              <th width="24%">접속 시간</th>
              <th width="15%">좌석</th>
              <th width="13%">비고</th>
            </tr>
          </thead>
          <tbody id="roster-tbody">
            <tr><td colspan="7" style="padding:40px; color:#94a3b8;">데이터 로딩 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer>© 2026 변재윤. All rights reserved.</footer>
  </div>

  <div id="modal-rps" class="modal-backdrop">
    <div class="modal-content">
      <h2 style="margin:0 0 10px 0; font-size:28px; color:#4F46E5;">⚡ 자리 경쟁!</h2>
      <p style="color:#64748b; font-size:16px; margin-bottom:25px; font-weight:700;">승부를 결정합니다. (1회 제한)</p>
      <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;">
        <div class="rps-btn" onclick="playRPS('rock')">✊</div>
        <div class="rps-btn" onclick="playRPS('paper')">✋</div>
        <div class="rps-btn" onclick="playRPS('scissors')">✌️</div>
      </div>
      <div id="rps-res" style="height:28px; font-weight:800; font-size:20px;"></div>
    </div>
  </div>

  <div class="toast" id="toast">알림</div>

<script>
  // ✅ 최신 배포 주소 반영
  const API_URL = "https://script.google.com/macros/s/AKfycbwPMF7balgXpI2csSKiv2X9ZYnL-8DpfNlkQKRtPKUOoe0t7kR6D6KkvDt9Oxr5EcdS/exec";
  const ROSTER_SHEET_ID = "1pAFJVLGveJv4FrX8iAixdFArV7K0FQ5Fr3dNL2yPefs";
  const ROSTER_SHEET_NAME = "명단";

  let STATE = { user: {}, map: {}, roster: [], isStarted: false, sched: null, mySeat: null };
  let prevStarted = false;
  let lostSeats = []; 

  async function handleLogin() {
    const cls = document.getElementById('login-class').value;
    const enteredId = document.getElementById('login-id').value.trim();
    const enteredName = document.getElementById('login-name').value.trim();
    if(!enteredId || !enteredName) return alert("정보를 입력해주세요.");

    // 교사 로그인: 학번 칸에 '교사', 이름 칸에 '99888' 입력
    // 기존 서버가 사용하는 교사 계정 형식(99888/교사)으로 변환하여 전송합니다.
    const isTeacherLogin = enteredId === "교사" && enteredName === "99888";
    const id = isTeacherLogin ? "99888" : enteredId;
    const name = isTeacherLogin ? "교사" : enteredName;

    const btn = document.getElementById('btn-login-action');
    btn.disabled = true; btn.innerText = "명단 확인 중...";

    try {
      const res = await fetch(API_URL, {
        method: 'POST', body: JSON.stringify({ action:'login', className:cls, studentId:id, studentName:name })
      });
      const json = await res.json();

      if(json.status === "success") {
        STATE.user = { id, name, cls };
	// 교사(99888)인 경우 표시하지 않고, 학생인 경우에만 정보를 표시합니다.
	if (id === "99888") {
	  document.getElementById('user-display').innerText = "";
	} else {
	  document.getElementById('user-display').innerText = `${name} (${id})`;
	}

	document.getElementById('map-class-title').innerText = cls;

        if(id === "99888" && name === "교사") {
          document.body.classList.add('teacher-mode');
          document.getElementById('teacher-panel').classList.remove('hidden');
          document.getElementById('roster-card').classList.remove('hidden');
        } else {
          document.body.classList.remove('teacher-mode');
          document.getElementById('student-alert').classList.remove('hidden');
          document.getElementById('student-controls').classList.remove('hidden');
        }

        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-main').classList.remove('hidden');

        updateTime(); setInterval(updateTime, 60000);
        createGrid();
        loadRoster(); 
        sync(); setInterval(sync, 1000);
      } else {
        alert("명단에 없는 학생입니다. 정보를 확인해주세요.");
        btn.disabled = false; btn.innerText = "입장하기";
      }
    } catch(e) {
      alert("서버 연결 실패. URL을 확인하세요.");
      btn.disabled = false; btn.innerText = "입장하기";
    }
  }

  function updateTime() {
    const d = new Date();
    document.getElementById('current-date').innerText = d.toLocaleString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit' });
  }

  async function assignAbsent() {
    if(!confirm("현재 접속하지 않은 학생들을 남은 좌석에 무작위로 배정하시겠습니까?")) return;
    
    const absentStudents = STATE.roster.filter(s => {
      const seated = Object.values(STATE.map).some(v => String(v.id) === String(s.id));
      return !seated;
    });

    if(absentStudents.length === 0) return alert("미접속 학생이 없습니다.");

    const emptySeats = [];
    [3,3,2].forEach((cnt, r) => {
      for(let t=1; t<=cnt; t++) {
        for(let s=1; s<=4; s++) {
          const seatId = `${r+1}-${t}-${s}`;
          if(!STATE.map[seatId]) emptySeats.push(seatId);
        }
      }
    });

    if(emptySeats.length < absentStudents.length) return alert(`남은 좌석(${emptySeats.length}개)이 부족합니다.`);

    emptySeats.sort(() => Math.random() - 0.5);
    
    const assignments = absentStudents.map((stu, idx) => ({
      seatId: emptySeats[idx],
      id: stu.id,
      name: stu.name,
      isAbsent: true 
    }));

    await fetch(API_URL, {
      method: 'POST', body: JSON.stringify({
        action: 'bulkAssign', className: STATE.user.cls, assignments: assignments
      })
    });
    alert(`${assignments.length}명의 미접속 학생을 배정했습니다.`);
    sync();
  }

  function autoAssign() {
    if(STATE.user.id === "99888") return;
    if(STATE.mySeat) return alert("이미 좌석이 확정되었습니다.");
    if(!STATE.isStarted) {
      const now = new Date().getTime();
      if(!(STATE.sched && now >= STATE.sched)) return alert("아직 좌석 배치가 시작되지 않았습니다.");
    }

    let emptySeats = [];
    document.querySelectorAll('.seat-btn:not(.occupied)').forEach(btn => {
      const sid = btn.id.replace('seat-', '');
      if(!lostSeats.includes(sid)) emptySeats.push(sid);
    });

    if(emptySeats.length === 0) return alert("빈 좌석이 없습니다.");
    const randomSeat = emptySeats[Math.floor(Math.random() * emptySeats.length)];
    reqSeat(randomSeat);
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
        else quoted = !quoted;
      } else if (ch === ',' && !quoted) {
        row.push(cell); cell = '';
      } else if ((ch === '\n' || ch === '\r') && !quoted) {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some(v => v !== '')) rows.push(row);
        row = [];
      } else {
        cell += ch;
      }
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function oldClassName(className) {
    return className.replace('전자기와 양자', '물리학');
  }

  async function loadRoster() {
    const tbody = document.getElementById('roster-tbody');
    if (STATE.user.id === "99888") {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:40px; color:#64748b;">구글 시트에서 명단을 불러오는 중...</td></tr>`;
    }

    // 1순위: 지정된 구글 시트의 '명단' 탭을 직접 읽습니다.
    try {
      const sheetUrl = `https://docs.google.com/spreadsheets/d/${ROSTER_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(ROSTER_SHEET_NAME)}&_=${Date.now()}`;
      const res = await fetch(sheetUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Google Sheet HTTP ${res.status}`);
      const rows = parseCsv(await res.text());
      const targetClass = STATE.user.cls.trim();

      STATE.roster = rows.slice(1)
        .filter(r => String(r[3] || '').trim() === targetClass)
        .map((r, index) => ({
          order: String(r[0] || index + 1).trim(),
          id: String(r[1] || '').trim(),
          name: String(r[2] || '').trim()
        }))
        .filter(s => s.id && s.name);

      if (STATE.roster.length) {
        if (STATE.user.id === "99888") renderTable();
        return;
      }
      throw new Error(`'${targetClass}' 명단이 비어 있습니다.`);
    } catch (sheetError) {
      console.warn('구글 시트 직접 로드 실패:', sheetError);
    }

    // 2순위: 기존 Apps Script API를 사용합니다. 새 분반명과 과거 분반명을 모두 지원합니다.
    try {
      const res = await fetch(`${API_URL}?action=getRoster&_=${Date.now()}`, { cache: 'no-store' });
      const json = await res.json();
      if (!json.ok) throw new Error('명단 API 응답 오류');

      const data = json.data || {};
      STATE.roster = data[STATE.user.cls] || data[oldClassName(STATE.user.cls)] || [];
      if (STATE.user.id === "99888") renderTable();

      if (!STATE.roster.length && STATE.user.id === "99888") {
        tbody.innerHTML = `<tr><td colspan="7" style="padding:40px; color:#dc2626; font-weight:700;">
          명단을 불러오지 못했습니다.<br>
          구글 시트의 공유 설정과 Apps Script 배포 주소를 확인하세요.
        </td></tr>`;
      }
    } catch (apiError) {
      console.error('명단 API 로드 실패:', apiError);
      STATE.roster = [];
      if (STATE.user.id === "99888") {
        tbody.innerHTML = `<tr><td colspan="7" style="padding:40px; color:#dc2626; font-weight:700;">
          구글 시트 명단 연결에 실패했습니다.<br>
          시트를 ‘링크가 있는 모든 사용자—뷰어’로 공유했는지 확인하세요.
        </td></tr>`;
      }
    }
  }

  function renderTable() {
    const tbody = document.getElementById('roster-tbody');
    const mapVal = Object.values(STATE.map);
    let presentCnt = 0;

    if(!STATE.roster.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:40px; font-size:18px; color:#94a3b8;">명단이 없습니다.</td></tr>`;
      return;
    }

    if (tbody.children.length !== STATE.roster.length || tbody.querySelector('.note-input') === null) {
      tbody.innerHTML = STATE.roster.map((std, index) => {
        const orderNum = std.order || (index + 1);
        return `<tr id="tr-${std.id}">
            <td><b>${orderNum}</b></td>
            <td>${std.id}</td>
            <td><b>${std.name}</b></td>
            <td id="td-badge-${std.id}"></td>
            <td id="td-time-${std.id}" style="font-size:16px; color:#64748b;"></td>
            <td id="td-seat-${std.id}" style="font-weight:800;"></td>
            <td style="text-align: left;">
              <span id="td-absent-${std.id}" style="color:#dc2626; font-weight:800; font-size:16px; margin-right:6px;"></span>
              <span class="excel-note" style="display:none;"></span>
              <input type="text" class="note-input" placeholder="비고 입력">
            </td>
          </tr>`;
      }).join('');
    }

    STATE.roster.forEach(std => {
      const info = mapVal.find(s => String(s.id) === String(std.id));
      const isSeated = !!info;
      if(isSeated) presentCnt++;

      const badge = isSeated ? `<span class="badge bg-green">출석</span>` : `<span class="badge bg-red">결석</span>`;
      let seatName = "-";
      let seatColor = "#cbd5e0";
      
      if(isSeated) {
        const p = info.seatId.split('-');
        seatName = `${p[0]}열-${p[1]}-${p[2]}`;
        seatColor = "#4F46E5";
      }
      
      const timeStr = isSeated ? info.timeStr : "-";
      const note = (info && info.isAbsent) ? "(미접속)" : "";

      const badgeEl = document.getElementById(`td-badge-${std.id}`);
      const timeEl = document.getElementById(`td-time-${std.id}`);
      const seatEl = document.getElementById(`td-seat-${std.id}`);
      const absentEl = document.getElementById(`td-absent-${std.id}`);

      if(badgeEl && badgeEl.innerHTML !== badge) badgeEl.innerHTML = badge;
      if(timeEl && timeEl.innerText !== timeStr) timeEl.innerText = timeStr;
      if(seatEl && seatEl.innerText !== seatName) {
        seatEl.innerText = seatName;
        seatEl.style.color = seatColor;
      }
      if(absentEl && absentEl.innerText !== note) absentEl.innerText = note;
    });

    document.getElementById('roster-count').innerText = `${presentCnt} / ${STATE.roster.length}`;
  }

  async function sync() {
    try {
      const res = await fetch(`${API_URL}?action=getState&className=${encodeURIComponent(STATE.user.cls)}`);
      const json = await res.json();
      
      if(!prevStarted && json.isStarted && STATE.user.id !== "99888") {
        showToast("🎉 좌석 배치가 시작되었습니다!");
      }
      prevStarted = json.isStarted;

      STATE.isStarted = json.isStarted;
      STATE.map = json.seatingMap || {};
      STATE.sched = json.scheduledTime;
      
      Object.entries(STATE.map).forEach(([k,v]) => v.seatId = k);
      STATE.mySeat = Object.keys(STATE.map).find(k => STATE.map[k].id === STATE.user.id);

      const msgEl = document.getElementById('sched-msg');
      if(STATE.sched) {
        const t = new Date(STATE.sched);
        msgEl.innerText = `⏳ 예약됨: ${t.getHours()}시 ${t.getMinutes()}분 시작`;
      } else {
        msgEl.innerText = "";
      }

      updateUI();
      if(STATE.user.id === "99888") renderTable(); 
    } catch(e) {}
  }

  function updateUI() {
    document.getElementById('btn-start').classList.toggle('hidden', STATE.isStarted);
    document.getElementById('btn-stop').classList.toggle('hidden', !STATE.isStarted);

    document.querySelectorAll('.seat-btn').forEach(btn => {
      const sid = btn.id.replace('seat-','');
      const info = STATE.map[sid];
      
      btn.className = 'seat-btn';
      btn.classList.remove('occupied', 'my-seat', 'absent-seat');

      if(info) {
        if(info.id === STATE.user.id) {
          btn.classList.add('my-seat');
          btn.innerHTML = `<small>나</small><b>${info.name}</b>`;
        } else {
          btn.classList.add('occupied');
          if(info.isAbsent) {
            btn.classList.add('absent-seat');
            btn.innerHTML = `<small>${info.id}</small><b>${info.name}</b><span>(미접속)</span>`;
          } else {
            btn.innerHTML = `<small>${info.id}</small><b>${info.name}</b>`;
          }
        }
      } else {
        const p = sid.split('-');
        btn.innerHTML = `<small>빈자리</small><b>${p[2]}</b>`;
        
        const now = new Date().getTime();
        const isLocked = !STATE.isStarted && (!STATE.sched || now < STATE.sched);
        
        if(STATE.user.id !== "99888") {
          if(isLocked || STATE.mySeat) {
            btn.style.opacity = 0.5; btn.style.cursor = "not-allowed";
          } else {
            btn.style.opacity = 1; btn.style.cursor = "pointer";
          }
        }
      }
    });
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  async function setSchedule() {
    const val = document.getElementById('sched-time').value;
    if(!val) return alert("시간을 선택하세요.");
    const ts = new Date(val).getTime();
    await postData({ action:'setSchedule', time:ts });
    alert("예약 완료"); sync();
  }

  async function toggleStart(start) {
    if(!confirm(start?"시작?":"마감?")) return;
    await postData({ action:'setStart', isStarted:start });
    sync();
  }

  async function resetSeats() {
    if(!confirm("초기화?")) return;
    await postData({ action:'resetSeats' });
    sync();
  }

  async function postData(data) {
    await fetch(API_URL, { method:'POST', body:JSON.stringify({ className:STATE.user.cls, ...data }) });
  }

  function downloadExcel() {
    document.querySelectorAll('.note-input').forEach(input => {
      const span = input.previousElementSibling;
      if(span && span.classList.contains('excel-note')) {
        span.innerText = input.value;
        span.style.display = 'inline';
      }
      input.style.display = 'none';
    });

    const wb = XLSX.utils.table_to_book(document.getElementById('export-table'), {sheet:"명단"});
    XLSX.writeFile(wb, `좌석배치_${STATE.user.cls}.xlsx`);

    document.querySelectorAll('.note-input').forEach(input => {
      const span = input.previousElementSibling;
      if(span && span.classList.contains('excel-note')) span.style.display = 'none';
      input.style.display = 'inline-block';
    });
  }

  function createGrid() {
    const c = document.getElementById('seat-grid');
    c.innerHTML = '';
    [3,3,2].forEach((cnt, r) => {
      const row = document.createElement('div'); row.className = 'seat-row';
      for(let t=1; t<=cnt; t++) {
        const g = document.createElement('div'); g.className = 'table-group';
        g.innerHTML = `<div class="table-label">${r+1}열-${t}</div>`;
        const s2 = document.createElement('div'); s2.className = 'seat-grid-2x2';
        for(let s=1; s<=4; s++) {
          const btn = document.createElement('div');
          const sid = `${r+1}-${t}-${s}`;
          btn.className = 'seat-btn'; btn.id = `seat-${sid}`;
          btn.onclick = () => handleClick(sid);
          s2.appendChild(btn);
        }
        g.appendChild(s2); row.appendChild(g);
      }
      c.appendChild(row);
    });
  }

  function handleClick(sid) {
    if(STATE.user.id === "99888") return;
    
    if(STATE.mySeat) return alert("이미 좌석이 확정되었습니다. (변경 불가)");
    if(STATE.map[sid]) return alert("이미 선택된 자리입니다.");
    if(lostSeats.includes(sid)) return alert("이 좌석은 게임에서 져서 선택할 수 없습니다.");

    const now = new Date().getTime();
    if(!STATE.isStarted) {
      if(!(STATE.sched && now >= STATE.sched)) return alert("아직 좌석 배치가 시작되지 않았습니다.");
    }

    window.targetSeat = sid;
    document.getElementById('modal-rps').classList.add('active');
    document.getElementById('rps-res').innerText = "";
    document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('disabled'));
  }

  function playRPS(c) {
    document.querySelectorAll('.rps-btn').forEach(b => b.classList.add('disabled'));

    const cpu = ['rock','paper','scissors'][Math.floor(Math.random()*3)];
    const map = {rock:'✊', paper:'✋', scissors:'✌️'};
    
    if(c===cpu) { 
      document.getElementById('rps-res').innerText = `무승부! 다시 하세요.`;
      setTimeout(() => document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('disabled')), 500);
      return; 
    }
    
    const win = (c==='rock'&&cpu==='scissors')||(c==='paper'&&cpu==='rock')||(c==='scissors'&&cpu==='paper');
    if(win) {
      const resEl = document.getElementById('rps-res');
      resEl.innerText = `승리! 즉시 배정됩니다...`;
      resEl.style.color = "#4F46E5";
      
      setTimeout(() => {
        document.getElementById('modal-rps').classList.remove('active');
        reqSeat(window.targetSeat);
      }, 500);
    } else {
      document.getElementById('rps-res').innerText = `패배... (${map[cpu]})`;
      document.getElementById('rps-res').style.color = "#ef4444";
      lostSeats.push(window.targetSeat);
      setTimeout(() => {
        document.getElementById('modal-rps').classList.remove('active');
        alert("패배하여 이 자리는 선택할 수 없습니다.");
      }, 1000);
    }
  }

  async function reqSeat(sid) {
    const el = document.getElementById(`seat-${sid}`);
    el.classList.add('my-seat'); el.innerHTML = `<small>...</small><b>${STATE.user.name}</b>`;

    const res = await fetch(API_URL, {
      method:'POST', body:JSON.stringify({
        action:'selectSeat', className:STATE.user.cls,
        studentId:STATE.user.id, studentName:STATE.user.name, seatId:sid
      })
    });
    const json = await res.json();
    if(json.status === "fail") {
      alert(json.message === "locked" ? "시작 전입니다." : "이미 선점되었습니다.");
      sync(); 
    } else {
      sync(); 
    }
  }

  function exportImage() {
    html2canvas(document.getElementById('seat-area-capture')).then(c => {
      const a = document.createElement('a');
      a.download = `좌석배치_${STATE.user.cls}.png`; a.href = c.toDataURL(); a.click();
    });
  }
</script>
